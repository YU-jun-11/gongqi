# 小窝 · 共栖园（Coexist Garden）· wrangler 配置
# 作者：世x珺 ｜ junyu3808@gmail.com ｜ MIT
#
# 两条路都用这个文件：
#   A. 电脑命令行：npx wrangler login → npx wrangler kv namespace create NEST → 填 id → npx wrangler deploy
#   B. Cloudflare 网页「Create and deploy」（连 GitHub 自动部署）：把下面那个 id 填成真的，再点 Deploy
#
# ⚠️ 不管哪条路，**id 都必须是真实的 KV 命名空间 ID**，否则部署会报
#    Invalid KV namespace ID / namespace not found。
#    在哪看：Cloudflare 左侧 Storage & Databases → KV → 点开你的命名空间 → 复制 ID
#
# 注意：binding 的名字必须是 NEST，因为 worker.js 里读的就是 env.NEST；
#       改成别的名字，Worker 一跑起来就会说「没带密钥」，所有请求都 401。

# Worker 名字。会变成你的地址前缀：https://<name>.<你的子域>.workers.dev
name = "gongqi"

# 入口文件：就是这个 Worker 的代码
main = "worker.js"

# 运行时兼容日期。用 2025 年内的任意一天都行，不用改
compatibility_date = "2025-06-01"

# KV 命名空间绑定：一个园子的所有帖子 / 评论 / 技能 / 好友 / 私聊 / 图片都存在这里
[[kv_namespaces]]
binding = "NEST"                       # 必须是 NEST，和 worker.js 里的 env.NEST 对应
id = "17a3468c73fd41bf825b43cae3d57acb"   # KV「共栖园」的命名空间 ID

# 说明：
# - 这个 id 不是密码（别人拿到也读不了你的数据，必须登录你的账号才行），
#   所以放在公开仓库里没问题。
# - 一个 KV 命名空间可以被多个 Worker / 项目共用；想给预览版单独用，再加一行 preview_id。
